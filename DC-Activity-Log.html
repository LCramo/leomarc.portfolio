<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DC Activity Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: logbook — summary strip, toolbar, month-grouped entries with a date gutter; detail and form open as a side sheet */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --sunk:#e8eaee; --line:#d5d9e0;
  --fg:#16191f; --muted:#5d6573; --accent:#b4580f; --accent-fg:#ffffff;
  --up:#2a5bd7; --up-bg:#e5ecfc; --on:#a86a00; --on-bg:#fbf0d9;
  --done:#1d7a4a; --done-bg:#def3e7; --cx:#6b7280; --cx-bg:#eceef1;
  --danger:#b42318; --shade:rgba(15,20,30,.38);
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111419; --surface:#181c23; --sunk:#20252e; --line:#2d3440;
  --fg:#e7eaf0; --muted:#98a1b0; --accent:#f0913f; --accent-fg:#1a1006;
  --up:#86a8ff; --up-bg:#1d2a4a; --on:#f2c160; --on-bg:#3a2d12;
  --done:#6fd39c; --done-bg:#163526; --cx:#a3aab6; --cx-bg:#262b33;
  --danger:#ff8a7a; --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111419; --surface:#181c23; --sunk:#20252e; --line:#2d3440;
  --fg:#e7eaf0; --muted:#98a1b0; --accent:#f0913f; --accent-fg:#1a1006;
  --up:#86a8ff; --up-bg:#1d2a4a; --on:#f2c160; --on-bg:#3a2d12;
  --done:#6fd39c; --done-bg:#163526; --cx:#a3aab6; --cx-bg:#262b33;
  --danger:#ff8a7a; --shade:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:2.3rem;font-weight:700;line-height:1}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
header.top .title{display:flex;flex-direction:column;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 14px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.strip button{border:0;background:none;text-align:left;padding:14px 16px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line)}
.strip button:last-child{border-right:0}
.strip button[aria-pressed="true"]{background:var(--sunk)}
.strip .n{font-family:var(--display);font-size:1.9rem;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.strip .l{display:flex;align-items:center;gap:7px;font-size:.82rem;color:var(--muted)}
.led{width:8px;height:8px;border-radius:50%;flex:none}
@media (max-width:560px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.strip button:nth-child(2){border-right:0}.strip button:nth-child(-n+2){border-bottom:1px solid var(--line)}}

.next{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;padding:12px 16px;border-radius:8px;background:var(--up-bg);color:var(--fg);border:1px solid color-mix(in srgb,var(--up) 30%,transparent)}
.next .eyebrow{color:var(--up)}
.next button{border:0;background:none;padding:0;font-weight:600;text-decoration:underline;text-underline-offset:3px}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar input[type=search]{flex:1 1 240px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 12px}
.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 10px}

.month{display:flex;flex-direction:column;gap:8px}
.month h2{font-size:1.15rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;gap:10px;align-items:center}
.month h2::after{content:"";flex:1;height:1px;background:var(--line)}
.month h2 .c{font-family:var(--mono);font-size:.75rem;letter-spacing:0}

.entry{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px;position:relative}
.entry:hover{border-color:var(--muted)}
.entry .date{display:flex;flex-direction:column;align-items:flex-start;border-right:1px solid var(--line);padding-right:10px}
.entry .d{font-family:var(--display);font-size:1.7rem;font-weight:700;line-height:1}
.entry .wd{font-family:var(--mono);font-size:.72rem;color:var(--muted);text-transform:uppercase}
.entry .tm{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-top:4px}
.entry .main{display:flex;flex-direction:column;gap:5px;min-width:0}
.entry .row1{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.entry .t{font-weight:600;font-size:1rem;overflow-wrap:anywhere}
.entry .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.82rem;color:var(--muted)}
.entry .meta span{display:inline-flex;gap:5px;min-width:0;overflow-wrap:anywhere}
.entry .meta b{font-weight:500;color:var(--fg)}
.entry .snip{font-size:.88rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.pill{font-family:var(--mono);font-size:.7rem;font-weight:500;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill .led{width:6px;height:6px}
.s-upcoming{background:var(--up-bg);color:var(--up)} .s-upcoming .led,.led.upcoming{background:var(--up)}
.s-ongoing{background:var(--on-bg);color:var(--on)} .s-ongoing .led,.led.ongoing{background:var(--on)}
.s-done{background:var(--done-bg);color:var(--done)} .s-done .led,.led.done{background:var(--done)}
.s-cancelled{background:var(--cx-bg);color:var(--cx)} .s-cancelled .led,.led.cancelled{background:var(--cx)}
.cat{font-size:.75rem;border:1px solid var(--line);border-radius:4px;padding:1px 7px;color:var(--muted);white-space:nowrap}
.sample{font-family:var(--mono);font-size:.68rem;color:var(--accent);border:1px dashed var(--accent);border-radius:4px;padding:0 6px}

.empty{border:1px dashed var(--line);border-radius:8px;padding:36px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}
.empty h3{font-size:1.4rem;color:var(--fg)}
.notice{border-radius:8px;padding:10px 14px;background:var(--on-bg);color:var(--fg);font-size:.9rem}

/* side sheet */
.shade{position:fixed;inset:0;background:var(--shade);z-index:20}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.sheet .hd h2{font-size:1.6rem;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.sheet .bd{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.sheet .ft{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
.sheet .ft .grow{flex:1}
.x{border:0;background:none;font-size:1.5rem;line-height:1;padding:2px 6px;color:var(--muted)}

.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;margin:0}
.facts div{display:flex;flex-direction:column;gap:2px;min-width:0}
.facts dt{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:0;overflow-wrap:anywhere}
.block{display:flex;flex-direction:column;gap:6px}
.block h3{font-size:1rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.block p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;max-width:65ch}
.block p.none{color:var(--muted);font-style:italic}
.stamp{font-family:var(--mono);font-size:.72rem;color:var(--muted)}

form .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
form .full{grid-column:1/-1}
@media (max-width:480px){form .grid,.facts{grid-template-columns:minmax(0,1fr)}}
label{display:flex;flex-direction:column;gap:5px;font-size:.82rem;font-weight:500;min-width:0}
label small{font-weight:400;color:var(--muted)}
label input,label select,label textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:9px 10px;font-size:.95rem;width:100%;min-width:0}
label textarea{min-height:84px;resize:vertical}
.err{color:var(--danger);font-size:.85rem}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.9rem}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:.9rem;z-index:30}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<div class="wrap">
  <p class="notice" style="margin:0">Saved only in this browser on this device. Use <b>Backup</b> regularly and <b>Restore</b> to move your log to another device.</p>
  <header class="top">
    <div class="title">
      <span class="eyebrow">NOC · Data Center Floor</span>
      <h1>DC Activity Log</h1>
    </div>
    <button class="btn primary" id="newBtn" type="button">+ New activity</button>
  </header>

  <div class="notice" id="dbNotice" hidden></div>

  <div class="strip" role="group" aria-label="Filter by status">
    <button type="button" data-st="upcoming" aria-pressed="false"><span class="n" id="cUp">0</span><span class="l"><i class="led upcoming"></i>Upcoming</span></button>
    <button type="button" data-st="ongoing" aria-pressed="false"><span class="n" id="cOn">0</span><span class="l"><i class="led ongoing"></i>Ongoing</span></button>
    <button type="button" data-st="done" aria-pressed="false"><span class="n" id="cDone">0</span><span class="l"><i class="led done"></i>Done</span></button>
    <button type="button" data-st="" aria-pressed="true"><span class="n" id="cAll">0</span><span class="l">All records</span></button>
  </div>

  <div class="next" id="nextUp" hidden></div>

  <div class="toolbar">
    <input type="search" id="q" placeholder="Search title, rack, ticket, requester, notes…" aria-label="Search">
    <select id="catFilter" aria-label="Category"><option value="">All categories</option></select>
    <select id="yearFilter" aria-label="Year"><option value="">All years</option></select>
    <button class="btn" type="button" id="csvBtn" hidden>Export CSV</button>
    <button class="btn" type="button" id="backupBtn">Backup</button>
    <button class="btn" type="button" id="restoreBtn">Restore</button>
    <input type="file" id="restoreFile" accept=".json,application/json" hidden>
  </div>

  <main id="list" aria-live="polite">
    <div class="empty"><h3>Loading your log…</h3><p>Your saved activities will appear here.</p></div>
  </main>
</div>

<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>

<script>
const CATS=["Hardware installation","Hardware replacement","Decommission / removal","Cabling / patching","Preventive maintenance","Power / UPS / PDU","Cooling / environment","Network change","Storage work","Server / OS work","Vendor / visitor escort","Audit / inspection","Incident response","Drill / test","Other"];
const STATUS={upcoming:"Upcoming",ongoing:"Ongoing",done:"Done",cancelled:"Cancelled"};
const FIELDS=[
 ["date","Date"],["start","Start"],["end","End"],["title","Activity"],["category","Category"],["status","Status"],
 ["location","Location / rack"],["ref","Ticket / CR no."],["requestedBy","Requested / ordered by"],["team","Done with / vendor"],
 ["purpose","Purpose (tungkol saan)"],["actions","Actions taken (ano ginawa)"],["outcome","Outcome (ano nangyari)"],["followUp","Follow-up / notes"]
];
let db=null, col=null, rows=[], state={st:"",q:"",cat:"",year:""}, canWrite=true, downloads=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const parseD=s=>{const [y,m,d]=(s||"").split("-").map(Number);return y?new Date(y,m-1,d):null};
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const fmtLong=s=>{const d=parseD(s);return d?`${WD[d.getDay()]}, ${MONTHS[d.getMonth()].slice(0,3)} ${d.getDate()}, ${d.getFullYear()}`:"—"};
const timeRange=r=>r.start?(r.start+(r.end?"–"+r.end:"")):"";

function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2400)}

$("#catFilter").innerHTML+=CATS.map(c=>`<option>${esc(c)}</option>`).join("");

function filtered(){
  const q=state.q.trim().toLowerCase();
  return rows.filter(r=>{
    if(state.st&&r.status!==state.st)return false;
    if(state.cat&&r.category!==state.cat)return false;
    if(state.year&&!(r.date||"").startsWith(state.year))return false;
    if(q){const hay=FIELDS.map(f=>r[f[0]]||"").join(" ").toLowerCase();if(!hay.includes(q))return false}
    return true;
  }).sort((a,b)=>{
    // upcoming filter: soonest first; otherwise newest first
    const k=(r)=>(r.date||"")+" "+(r.start||"");
    return state.st==="upcoming"?k(a).localeCompare(k(b)):k(b).localeCompare(k(a));
  });
}

function render(){
  const c=s=>rows.filter(r=>r.status===s).length;
  $("#cUp").textContent=c("upcoming");$("#cOn").textContent=c("ongoing");$("#cDone").textContent=c("done");$("#cAll").textContent=rows.length;
  document.querySelectorAll(".strip button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.st===state.st)));
  // years
  const years=[...new Set(rows.map(r=>(r.date||"").slice(0,4)).filter(Boolean))].sort().reverse();
  const ys=$("#yearFilter"),cur=ys.value;ys.innerHTML='<option value="">All years</option>'+years.map(y=>`<option>${y}</option>`).join("");ys.value=years.includes(cur)?cur:"";
  // next up
  const t=todayStr();
  const nxt=rows.filter(r=>r.status==="upcoming"&&(r.date||"")>=t).sort((a,b)=>((a.date||"")+(a.start||"")).localeCompare((b.date||"")+(b.start||"")))[0];
  const nu=$("#nextUp");
  if(nxt){nu.hidden=false;nu.innerHTML=`<span class="eyebrow">Next up</span><span class="mono">${esc(fmtLong(nxt.date))}${nxt.start?" · "+esc(nxt.start):""}</span><button type="button" data-id="${esc(nxt.id)}">${esc(nxt.title||"Untitled")}</button>${nxt.location?`<span>${esc(nxt.location)}</span>`:""}`;nu.querySelector("button").onclick=()=>openDetail(nxt.id)}
  else nu.hidden=true;
  $("#csvBtn").hidden=!(downloads&&rows.length);

  const list=$("#list"),items=filtered();
  if(!rows.length){list.innerHTML=`<div class="empty"><h3>No activities yet</h3><p>Log your first data center activity: an upcoming schedule or one you already finished.</p>${canWrite&&db?'<button class="btn primary" type="button" id="emptyNew">+ New activity</button>':""}</div>`;const b=$("#emptyNew");if(b)b.onclick=()=>openForm();return}
  if(!items.length){list.innerHTML=`<div class="empty"><h3>No matches</h3><p>Nothing fits these filters. Clear the search or pick another status.</p></div>`;return}
  const groups=new Map();
  for(const r of items){const d=parseD(r.date);const key=d?`${MONTHS[d.getMonth()]} ${d.getFullYear()}`:"No date";if(!groups.has(key))groups.set(key,[]);groups.get(key).push(r)}
  list.innerHTML=[...groups].map(([k,g])=>`<section class="month"><h2>${esc(k)} <span class="c">${g.length}</span></h2>${g.map(entryHTML).join("")}</section>`).join("");
  list.querySelectorAll(".entry").forEach(e=>e.onclick=()=>openDetail(e.dataset.id));
}
function entryHTML(r){
  const d=parseD(r.date);
  return `<button type="button" class="entry" data-id="${esc(r.id)}">
    <span class="date"><span class="d mono">${d?d.getDate():"–"}</span><span class="wd">${d?WD[d.getDay()]:""}</span>${r.start?`<span class="tm">${esc(timeRange(r))}</span>`:""}</span>
    <span class="main">
      <span class="row1"><span class="pill s-${esc(r.status)}"><i class="led"></i>${esc(STATUS[r.status]||r.status)}</span>${r.category?`<span class="cat">${esc(r.category)}</span>`:""}${r.sample?'<span class="sample">SAMPLE</span>':""}</span>
      <span class="t">${esc(r.title||"Untitled activity")}</span>
      <span class="meta">${r.location?`<span>Loc <b>${esc(r.location)}</b></span>`:""}${r.ref?`<span>Ref <b class="mono">${esc(r.ref)}</b></span>`:""}${r.requestedBy?`<span>By <b>${esc(r.requestedBy)}</b></span>`:""}</span>
      ${(r.outcome||r.purpose)?`<span class="snip">${esc(r.status==="done"&&r.outcome?r.outcome:(r.purpose||r.outcome))}</span>`:""}
    </span></button>`;
}

/* sheets */
function closeSheet(){$("#sheetRoot").innerHTML="";document.removeEventListener("keydown",escKey)}
function escKey(e){if(e.key==="Escape")closeSheet()}
function sheet(html){$("#sheetRoot").innerHTML=`<div class="shade"></div><aside class="sheet" role="dialog" aria-modal="true">${html}</aside>`;$(".shade").onclick=closeSheet;document.addEventListener("keydown",escKey);$(".sheet .x").onclick=closeSheet}

function openDetail(id){
  const r=rows.find(x=>x.id===id);if(!r)return;
  const blk=(h,v)=>`<div class="block"><h3>${h}</h3><p class="${v?"":"none"}">${v?esc(v):"Not recorded"}</p></div>`;
  sheet(`<div class="hd"><div style="display:flex;flex-direction:column;gap:8px;min-width:0"><span class="row1" style="display:flex;gap:8px;flex-wrap:wrap"><span class="pill s-${esc(r.status)}"><i class="led"></i>${esc(STATUS[r.status])}</span>${r.category?`<span class="cat">${esc(r.category)}</span>`:""}${r.sample?'<span class="sample">SAMPLE</span>':""}</span><h2>${esc(r.title||"Untitled activity")}</h2></div><button class="x" type="button" aria-label="Close">×</button></div>
  <div class="bd">
    <dl class="facts">
      <div><dt>Date</dt><dd>${esc(fmtLong(r.date))}</dd></div>
      <div><dt>Time</dt><dd class="mono">${esc(timeRange(r)||"—")}</dd></div>
      <div><dt>Location / rack</dt><dd>${esc(r.location||"—")}</dd></div>
      <div><dt>Ticket / CR no.</dt><dd class="mono">${esc(r.ref||"—")}</dd></div>
      <div><dt>Requested by</dt><dd>${esc(r.requestedBy||"—")}</dd></div>
      <div><dt>Done with / vendor</dt><dd>${esc(r.team||"—")}</dd></div>
    </dl>
    ${blk("Purpose",r.purpose)}${blk("Actions taken",r.actions)}${blk("Outcome",r.outcome)}${blk("Follow-up / notes",r.followUp)}
    <span class="stamp">${r.updatedAt?"Last updated "+esc(new Date(r.updatedAt).toLocaleString()):""}</span>
  </div>
  <div class="ft" id="dFt">${canWrite&&db?`<button class="btn danger" type="button" id="delBtn">Delete</button><span class="grow"></span><button class="btn" type="button" id="dupBtn">Duplicate</button><button class="btn primary" type="button" id="editBtn">Edit</button>`:`<span class="stamp">Read-only view</span>`}</div>`);
  if(!(canWrite&&db))return;
  $("#editBtn").onclick=()=>openForm(r);
  $("#dupBtn").onclick=()=>{const c={...r};delete c.id;delete c.sample;c.status="upcoming";c.date=todayStr();c.actions="";c.outcome="";openForm(c,true)};
  $("#delBtn").onclick=()=>{$("#dFt").innerHTML=`<div class="confirm"><span>Delete this record for good?</span><button class="btn" type="button" id="noDel">Keep it</button><button class="btn danger solid" type="button" id="yesDel">Delete</button></div>`;
    $("#noDel").onclick=()=>openDetail(id);
    $("#yesDel").onclick=async()=>{try{await col.doc(id).delete();closeSheet();toast("Record deleted")}catch(e){toast("Couldn't delete. Try again.")}}};
}

function openForm(r={},isCopy=false){
  const editing=!!r.id;
  const v=k=>esc(r[k]??"");
  const opt=(list,sel)=>list.map(([val,lab])=>`<option value="${esc(val)}"${val===sel?" selected":""}>${esc(lab)}</option>`).join("");
  sheet(`<div class="hd"><h2>${editing?"Edit activity":isCopy?"New activity (copy)":"New activity"}</h2><button class="x" type="button" aria-label="Close">×</button></div>
  <form id="f" class="bd" novalidate>
    <div class="grid">
      <label class="full" for="f_title">Activity <small>Short name, e.g. "Replace failed PSU on DB server"</small><input id="f_title" name="title" required maxlength="160" value="${v("title")}"></label>
      <label for="f_date">Date<input id="f_date" type="date" name="date" required value="${esc(r.date||todayStr())}"></label>
      <label for="f_status">Status<select id="f_status" name="status">${opt(Object.entries(STATUS),r.status||"upcoming")}</select></label>
      <label for="f_start">Start time<input id="f_start" type="time" name="start" value="${v("start")}"></label>
      <label for="f_end">End time<input id="f_end" type="time" name="end" value="${v("end")}"></label>
      <label for="f_cat">Category<select id="f_cat" name="category"><option value="">Choose…</option>${opt(CATS.map(c=>[c,c]),r.category||"")}</select></label>
      <label for="f_loc">Location / rack <small>Room, row, rack, U</small><input id="f_loc" name="location" value="${v("location")}" placeholder="DH2 · Row C · R07 · U22"></label>
      <label for="f_ref">Ticket / CR no.<input id="f_ref" name="ref" value="${v("ref")}" placeholder="CHG0012345"></label>
      <label for="f_req">Requested / ordered by<input id="f_req" name="requestedBy" value="${v("requestedBy")}" placeholder="Name, team"></label>
      <label class="full" for="f_team">Done with / vendor <small>Co-engineers, vendor, escorted visitors</small><input id="f_team" name="team" value="${v("team")}"></label>
      <label class="full" for="f_purpose">Purpose <small>Tungkol saan ang activity</small><textarea id="f_purpose" name="purpose">${v("purpose")}</textarea></label>
      <label class="full" for="f_actions">Actions taken <small>Ano ang ginawa, step by step</small><textarea id="f_actions" name="actions">${v("actions")}</textarea></label>
      <label class="full" for="f_outcome">Outcome <small>Ano ang nangyari: success, issues, downtime</small><textarea id="f_outcome" name="outcome">${v("outcome")}</textarea></label>
      <label class="full" for="f_follow">Follow-up / notes<textarea id="f_follow" name="followUp">${v("followUp")}</textarea></label>
    </div>
    <span class="err" id="fErr" hidden></span>
  </form>
  <div class="ft"><button class="btn" type="button" id="cancelF">Cancel</button><button class="btn primary" type="submit" form="f" id="saveF">${editing?"Save changes":"Save activity"}</button></div>`);
  $("#cancelF").onclick=()=>editing?openDetail(r.id):closeSheet();
  $("#f_title").focus();
  $("#f").onsubmit=async e=>{
    e.preventDefault();
    const fd=new FormData(e.target),data={};
    for(const [k] of FIELDS)data[k]=(fd.get(k)||"").toString().trim();
    const err=$("#fErr");
    if(!data.title||!data.date){err.hidden=false;err.textContent="Add an activity name and a date to save.";return}
    if(!CATS.includes(data.category)&&data.category)data.category="Other";
    data.updatedAt=Date.now();
    const btn=$("#saveF");btn.disabled=true;btn.textContent="Saving…";
    try{
      if(editing){await col.doc(r.id).set({...data,createdAt:r.createdAt||Date.now()});openDetail(r.id);toast("Changes saved")}
      else{const ref=col.doc();data.createdAt=Date.now();await ref.set(data);closeSheet();toast("Activity saved")}
    }catch(ex){btn.disabled=false;btn.textContent="Try again";err.hidden=false;
      err.textContent=ex&&ex.code==="quota_exceeded"?"The log is full. Delete old records to add new ones.":ex&&ex.code==="invalid_argument"?"You can view this log but not change it.":"Couldn't save. Check your connection and try again."}
  };
}

/* CSV export */
async function exportCSV(){
  const head=FIELDS.map(f=>f[1]);
  const lines=[head,...filtered().map(r=>FIELDS.map(([k])=>k==="status"?STATUS[r[k]]||r[k]:r[k]||""))].map(a=>a.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(","));
  try{await downloads.save({filename:`dc-activity-log-${todayStr()}.csv`,data:"﻿"+lines.join("\r\n")});}catch(e){}
}
$("#csvBtn").onclick=exportCSV;

/* controls */
document.querySelectorAll(".strip button").forEach(b=>b.onclick=()=>{state.st=b.dataset.st===state.st&&b.dataset.st?"":b.dataset.st;render()});
let qt;$("#q").oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{state.q=e.target.value;render()},120)};
$("#catFilter").onchange=e=>{state.cat=e.target.value;render()};
$("#yearFilter").onchange=e=>{state.year=e.target.value;render()};
$("#newBtn").onclick=()=>openForm();

/* storage: this browser only (localStorage) */
const KEY="dc-activity-log.v1";
const SEED=[{"actions": "", "category": "Preventive maintenance", "createdAt": 1792554917446, "date": "2026-10-24", "end": "", "followUp": "", "location": "2FM4K02 and 2FM4K08", "outcome": "", "purpose": "", "ref": "BC-CHG0036381", "requestedBy": "Richard Escobanas -Network", "start": "23:00", "status": "upcoming", "team": "", "title": "F5 BIG-IP Threat Campaign Activation", "updatedAt": 1792557090500, "id": "9gi7cfrqkbovq5hlcuww"}, {"actions": "1. Coordinate with Rajitha and Pooja.\n2. Setup the monitor connected to NTP1 (first server).\n3. Unix team proceed with the backup and patching.\n4. Monitor and confirmed the physical status after the patching.\n5. Close the change ticket and update the mail.\n\n-same process with NTP2", "category": "Cabling / patching", "createdAt": 1792555668058, "date": "2026-10-09", "end": "12:20", "followUp": "", "location": "2FM4L06 and 2FM4L07", "outcome": "Patching has been successfully completed for both NTP servers.", "purpose": "Monthly patching of NTP1 and NTP2 servers.", "ref": "BC-CHG0036359", "requestedBy": "Rajitha Ganala - Unix", "start": "10:00", "status": "done", "team": "NA", "title": "NTP Servers Patching", "updatedAt": 1792555668057, "id": "qz3zsr5oz54ewj8trauk"}];
function load(){try{const s=localStorage.getItem(KEY);if(s===null){save(SEED);return SEED.slice()}return JSON.parse(s)||[]}catch(e){return SEED.slice()}}
function save(list){try{localStorage.setItem(KEY,JSON.stringify(list));return true}catch(e){toast("Couldn't save in this browser. Check that site storage is allowed.");return false}}
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
db={};
col={doc(id){id=id||newId();return{
  async set(data){const list=load().filter(r=>r.id!==id);list.push({...data,id});if(!save(list))throw{code:"unavailable"};rows=list;render()},
  async delete(){const list=load().filter(r=>r.id!==id);save(list);rows=list;render()}}}};
function fileOut(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
downloads={async save({filename,data}){fileOut(filename,data,"text/csv;charset=utf-8")}};
$("#backupBtn").onclick=()=>{fileOut(`dc-activity-log-backup-${todayStr()}.json`,JSON.stringify(load(),null,2),"application/json");toast("Backup downloaded")};
$("#restoreBtn").onclick=()=>$("#restoreFile").click();
$("#restoreFile").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const data=JSON.parse(await f.text());if(!Array.isArray(data))throw 0;
    const map=new Map(load().map(r=>[r.id,r]));let n=0;
    for(const r of data){if(r&&typeof r==="object"&&r.title&&r.date){const id=r.id||newId();map.set(id,{...r,id});n++}}
    const list=[...map.values()];save(list);rows=list;render();toast(n+" record(s) restored")}
  catch(err){toast("That file isn't a DC Activity Log backup.")}};
window.addEventListener("storage",ev=>{if(ev.key===KEY){rows=load();render()}});
rows=load();render();
</script>
